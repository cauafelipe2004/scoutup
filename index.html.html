// ---------- Lightweight chart (replaces recharts, which needs a bundler) ----------
function MiniLineChart({ data, color = "#C6FF3D" }) {
  const w = 300, h = 90, padX = 8, padY = 10;
  const values = data.map((d) => d.v);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = (w - padX * 2) / (data.length - 1);
  const points = data.map((d, i) => {
    const x = padX + i * stepX;
    const y = padY + (h - padY * 2) * (1 - (d.v - min) / range);
    return { x, y, label: d.m };
  });
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x},${p.y}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="100%" preserveAspectRatio="none">
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill={color} />)}
      {points.map((p, i) => (
        <text key={i} x={p.x} y={h - 1} fontSize="8" fill="#8B8D93" textAnchor="middle">{p.label}</text>
      ))}
    </svg>
  );
}

function LoginScreen({ go, setPlayer }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [touched, setTouched] = useState(false);
  const [loading, setLoading] = useState(false);
  const [googleLoading, setGoogleLoading] = useState(false);
  const [googleErro, setGoogleErro] = useState("");

  const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const senhaValida = senha.length >= 6;
  const podeEntrar = emailValido && senhaValida;

  const emailErro = touched && !email ? "Informe seu e-mail" : touched && !emailValido ? "E-mail inválido" : "";
  const senhaErro = touched && !senha ? "Informe sua senha" : touched && !senhaValida ? "Mínimo de 6 caracteres" : "";

  const handleEntrar = () => {
    setTouched(true);
    if (!podeEntrar) return;
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      go("profileChoice");
    }, 500);
  };

  const handleGoogleLogin = () => {
    setGoogleErro("");

    if (GOOGLE_CLIENT_ID.includes("COLOQUE_SEU_CLIENT_ID_AQUI")) {
      setGoogleErro("Login com Google ainda não configurado. Veja o comentário no topo do código.");
      return;
    }
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      setGoogleErro("Não foi possível carregar o login do Google. Verifique sua conexão e tente de novo.");
      return;
    }

    setGoogleLoading(true);
    try {
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: "openid email profile",
        callback: async (tokenResponse) => {
          try {
            if (!tokenResponse || !tokenResponse.access_token) {
              throw new Error("Sem token de acesso na resposta do Google.");
            }
            const res = await fetch(
              `https://www.googleapis.com/oauth2/v3/userinfo?access_token=${tokenResponse.access_token}`
            );
            if (!res.ok) throw new Error("Falha ao buscar dados da conta Google.");
            const profile = await res.json();
            setPlayer((prev) => ({
              ...prev,
              nome: profile.name || prev.nome,
              email: profile.email || prev.email,
            }));
            go("profileChoice");
          } catch (e) {
            setGoogleErro("Não deu para completar o login com Google. Tente novamente.");
          } finally {
            setGoogleLoading(false);
          }
        },
        error_callback: () => {
          setGoogleLoading(false);
          setGoogleErro("O login com Google foi cancelado ou falhou.");
        },
      });
      client.requestAccessToken();
    } catch (e) {
      setGoogleLoading(false);
      setGoogleErro("Não foi possível iniciar o login com Google.");
    }
  };

  return (
    <div className="h-full w-full bg-[#0B0B0C] flex flex-col px-6 py-10 text-white">
      <div className="flex justify-center mb-8 mt-4">
        <Logo size={48} />
      </div>
      <h1 className="text-[22px] font-bold text-center mb-8" style={DISPLAY}>Bem-vindo ao <Wordmark /></h1>

      <div className="space-y-3 mb-4">
        <div>
          <label className="block text-[11.5px] font-semibold text-white/40 mb-1.5 uppercase tracking-wide" style={DISPLAY}>E-mail</label>
          <input
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            placeholder="seu@email.com"
            style={BODY}

function calcIdade(dataStr) {
  // Accepts dd/mm/aaaa; returns null if it can't be parsed.
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((dataStr || "").trim());
  if (!m) return null;
  const [, d, mo, y] = m;
  const nascimento = new Date(Number(y), Number(mo) - 1, Number(d));
  if (Number.isNaN(nascimento.getTime())) return null;
  const hoje = new Date();
  let idade = hoje.getFullYear() - nascimento.getFullYear();
  const aindaNaoFezAniversario =
    hoje.getMonth() < nascimento.getMonth() ||
    (hoje.getMonth() === nascimento.getMonth() && hoje.getDate() < nascimento.getDate());
  if (aindaNaoFezAniversario) idade -= 1;
  return idade;
}

function PlayerSignupScreen({ go, goBack, player, setPlayer }) {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({
    nome: player.nome || "",
    nascimento: player.nascimento || "",
    cidade: player.cidade || "",
    posicao: player.posicao || "Meia",
    peDominante: player.peDominante || "",
    altura: player.altura || "",
    categoria: player.categoria || "",
    clube: player.clube || "",
  });
  const [erros, setErros] = useState({});
  const totalSteps = 3;

  const setField = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const validarStep = () => {
    const e = {};
    if (step === 1) {
      if (!form.nome.trim()) e.nome = "Informe seu nome completo";
      if (!form.nascimento.trim()) e.nascimento = "Informe sua data de nascimento";
      else if (calcIdade(form.nascimento) === null) e.nascimento = "Use o formato dd/mm/aaaa";
      if (!form.cidade.trim()) e.cidade = "Informe sua cidade";
    } else if (step === 2) {
      if (!form.peDominante.trim()) e.peDominante = "Informe seu pé dominante";
      if (!form.altura.trim()) e.altura = "Informe sua altura";
      if (!form.categoria.trim()) e.categoria = "Informe sua categoria";
    }
    setErros(e);
    return Object.keys(e).length === 0;
  };

  const handleContinuar = () => {
    if (!validarStep()) return;
    if (step < totalSteps) {
      setStep(step + 1);
    } else {
      const idade = calcIdade(form.nascimento);
      setPlayer({ ...player, ...form, idade: idade ?? player.idade });
      go("home");
    }
  };

  const inputClass = (field) =>
    `w-full bg-[#16171A] border rounded-xl px-3.5 py-3 text-[14.5px] text-white focus:outline-none focus:border-[#C6FF3D]/60 ${erros[field] ? "border-red-500/60" : "border-[#242427]"}`;

        {Array.from({ length: totalSteps }).map((_, i) => (
          <div key={i} className={`h-1 flex-1 rounded-full ${i < step ? "bg-[#C6FF3D]" : "bg-[#242427]"}`} />
        ))}
      </div>
      <Screen>
        <div className="p-5">
          {step === 1 && (
            <>
              <p className="text-[12px] text-white/40 mb-4 uppercase tracking-wide" style={DISPLAY}>Etapa 1 de 3 — Dados básicos</p>
              <div className="flex flex-col items-center mb-5">
                <div className="w-24 h-24 rounded-full bg-[#16171A] border border-[#242427] flex items-center justify-center text-white/40 mb-2">
                  <User size={36} />
                </div>
                <button className="text-[12px] font-bold text-[#C6FF3D] uppercase tracking-wide" style={DISPLAY}>Adicionar foto</button>
              </div>
              <div className="mb-4">
                <label className="block text-[12px] font-semibold text-white/40 mb-1.5" style={BODY}>Nome completo</label>
                <input style={BODY} className={inputClass("nome")} placeholder="Nome completo"
                  value={form.nome} onChange={(e) => setField("nome", e.target.value)} />
                <FieldError message={erros.nome} />
              </div>
              <div className="mb-4">
                <label className="block text-[12px] font-semibold text-white/40 mb-1.5" style={BODY}>Data de nascimento</label>
                <input style={BODY} className={inputClass("nascimento")} placeholder="dd/mm/aaaa"
                  value={form.nascimento} onChange={(e) => setField("nascimento", e.target.value)} />
                <FieldError message={erros.nascimento} />
              </div>
              <div className="mb-4">
                <label className="block text-[12px] font-semibold text-white/40 mb-1.5" style={BODY}>Cidade</label>
                <input style={BODY} className={inputClass("cidade")} placeholder="Cidade"
                  value={form.cidade} onChange={(e) => setField("cidade", e.target.value)} />
                <FieldError message={erros.cidade} />
              </div>
            </>
          )}
          {step === 2 && (
            <>
              <p className="text-[12px] text-white/40 mb-4 uppercase tracking-wide" style={DISPLAY}>Etapa 2 de 3 — Perfil esportivo</p>
              <div className="mb-4">
                <label className="block text-[12px] font-semibold text-white/40 mb-1.5" style={BODY}>Posição</label>
                <div className="flex flex-wrap gap-2">
                  {POSICOES.map((p) => (

                <input style={BODY} className={inputClass("peDominante")} placeholder="Ex: Destro"

              </div>
              <div className="mb-4">

                <FieldError message={erros.altura} />

              </Card>
            </>
          )}

          <div className="pt-3">
            <PrimaryButton onClick={handleContinuar}>
              {step < totalSteps ? "Continuar" : "Concluir cadastro"}
            </PrimaryButton>
          </div>
        </div>

    </div>
  );

function VarUploadScreen({ go, varSession, setVarSession }) {
  const [file, setFile] = useState(null);
  const [progress, setProgress] = useState(0);
  const [preview, setPreview] = useState("");
  const inputRef = useRef(null);
  const pickFile = (f) => {
    if (!f) return;
    setFile(f);
    setPreview(URL.createObjectURL(f));
    setProgress(0);
  };
  useEffect(() => {
    if (!file) return;
    const t = setInterval(() => setProgress(p => p >= 100 ? 100 : p + 8), 100);
    return () => clearInterval(t);
  }, [file]);
  const done = progress >= 100;
  return (
    <div className="h-full bg-[#0B0B0C] flex flex-col text-white">
      <TopBar title="Enviar vídeo" onBack={() => go("varIntro")} />
      <Screen>
        <div className="px-5">
          <input ref={inputRef} type="file" accept="video/mp4,video/quicktime,video/*" className="hidden" onChange={e => pickFile(e.target.files?.[0])}/>
          <button onClick={() => inputRef.current?.click()} className="w-full aspect-video rounded-3xl bg-[#16171A] border border-dashed border-[#2A2B2E] flex items-center justify-center mb-4 overflow-hidden">
            {preview ? <video src={preview} className="w-full h-full object-cover" controls /> : <div className="text-center"><Upload size={30} className="mx-auto text-[#C6FF3D] mb-2"/><p className="font-bold text-[14px]" style={DISPLAY}>Escolha uma jogada</p><p className="text-[11px] text-white/30 mt-1" style={BODY}>MP4 ou MOV • até 60 segundos</p></div>}
          </button>
          {file ? <><p className="font-semibold text-[13px] mb-1" style={BODY}>{file.name}</p><div className="h-1.5 bg-white/8 rounded-full overflow-hidden mb-2"><div className="h-full bg-[#C6FF3D] transition-all" style={{width:`${progress}%`}}/></div><p className="text-[11px] text-white/35 mb-5" style={BODY}>{done ? "Vídeo pronto para análise ✓" : `Processando upload… ${progress}%`}</p></> : <p className="text-[11px] text-white/30 mb-5" style={BODY}>Você poderá escolher depois o foco da análise.</p>}

        </div>
      </Screen>
    </div>
  );
}

// ---------- App shell ----------
const NAV_SCREENS = ["home", "peneiras", "varIntro", "opportunities", "profile"];

const DEFAULT_PLAYER = {
  nome: "",
  email: "",
  nascimento: "",
  cidade: "",
  posicao: "Meia",
  peDominante: "",
  altura: "",
  categoria: "",
  clube: "",
  idade: null,
};

function App() {
  useFonts();
  const [screen, setScreen] = useState("splash");
  const [history, setHistory] = useState([]);
  const [selectedPeneira, setSelectedPeneira] = useState(null);
  const [player, setPlayer] = useState(() => {
    try { return { ...DEFAULT_PLAYER, ...JSON.parse(localStorage.getItem("scoutup_player") || "null") }; }
    catch { return DEFAULT_PLAYER; }
  });
  useEffect(() => { try { localStorage.setItem("scoutup_player", JSON.stringify(player)); } catch {} }, [player]);
  const [inscricoes, setInscricoes] = useState(() => { try { return JSON.parse(localStorage.getItem("scoutup_inscricoes") || "[]"); } catch { return []; } }); // array of peneira ids
  const [varSession, setVarSession] = useState(() => { try { return JSON.parse(localStorage.getItem("scoutup_var") || "null") || { foco: ["Tomada de decisão", "Passe"], intencao: "" }; } catch { return { foco: ["Tomada de decisão", "Passe"], intencao: "" }; } });
  useEffect(() => { try { localStorage.setItem("scoutup_inscricoes", JSON.stringify(inscricoes)); } catch {} }, [inscricoes]);
  useEffect(() => { try { localStorage.setItem("scoutup_var", JSON.stringify(varSession)); } catch {} }, [varSession]);

  // go(screen) pushes the current screen onto the history stack so goBack can return to it.
  const go = (s) => {
    setHistory((h) => [...h, screen]);
    setScreen(s);
  };
  // goBack pops the stack; falls back to a sensible default if the stack is empty.
  const goBack = (fallback = "home") => {
    setHistory((h) => {
      if (h.length === 0) {
        setScreen(fallback);
        return h;
      }
      const next = [...h];
      const prev = next.pop();
      setScreen(prev);
      return next;
    });
  };

  const inscrever = (peneiraId) =>
    setInscricoes((ids) => (ids.includes(peneiraId) ? ids : [...ids, peneiraId]));

  const renderScreen = () => {
    switch (screen) {
      case "splash": return <SplashScreen go={go} />;
      case "login": return <LoginScreen go={go} setPlayer={setPlayer} />;
      case "profileChoice": return <ProfileChoiceScreen go={go} goBack={goBack} />;
      case "playerSignup": return <PlayerSignupScreen go={go} goBack={goBack} player={player} setPlayer={setPlayer} />;
      case "home": return <HomeScreen go={go} setSelected={setSelectedPeneira} player={player} inscricoes={inscricoes} />;
      case "peneiras": return <PeneirasScreen go={go} setSelected={setSelectedPeneira} />;
      case "peneiraDetail": return <PeneiraDetailScreen go={go} goBack={goBack} peneira={selectedPeneira} inscricoes={inscricoes} />;
      case "myInscriptions": return <MyInscriptionsScreen go={go} goBack={goBack} peneira={selectedPeneira} inscricoes={inscricoes} inscrever={inscrever} />;
      case "varIntro": return <VarIntroScreen go={go} />;
      case "varUpload": return <VarUploadScreen go={go} varSession={varSession} setVarSession={setVarSession} />;
      case "varConfig": return <VarConfigScreen go={go} varSession={varSession} setVarSession={setVarSession} />;
      case "varAnalyzing": return <VarAnalyzingScreen go={go} varSession={varSession} />;
      case "varResult": return <VarResultScreen go={go} varSession={varSession} />;
      case "varFeedback": return <VarFeedbackScreen go={go} varSession={varSession} />;
      case "varHistory": return <VarHistoryScreen go={go} />;
      case "profile": return <ProfileScreen go={go} player={player} />;
      case "passport": return <PassportScreen go={go} player={player} />;
      case "security": return <SecurityScreen go={go} />;
      case "opportunities": return <OpportunitiesScreen go={go} />;
      case "socialProjects": return <SocialProjectsScreen go={go} />;
      case "clubDashboard": return <ClubDashboardScreen go={go} />;
      default: return <SplashScreen go={go} />;
    }
  };

  const showNav = NAV_SCREENS.includes(screen);

  return (
    <div className="w-full h-screen bg-[#1a1a1c] flex items-center justify-center overflow-hidden" style={BODY}>
      <div className="relative w-full max-w-[420px] h-[min(860px,100vh)] bg-[#0B0B0C] shadow-2xl overflow-hidden flex flex-col">
        <div className="relative flex-1 min-h-0 flex flex-col">
          {renderScreen()}
          {showNav && <BottomNav screen={screen} go={go} />}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
  // Manually transform the JSX above with the classic runtime, so it always calls
  // React.createElement() from the global `React` (matches the UMD build loaded via CDN).
  // We don't rely on Babel's automatic <script type="text/babel"> scanning because newer
  // Babel versions default to the "automatic" JSX runtime, which emits an ES module
  // `import` statement — and that silently fails inside a plain (non-module) <script> tag.
  var src = document.getElementById("app-source").textContent;
  var output = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
  var script = document.createElement("script");
  script.textContent = output;
  document.body.appendChild(script);
</script>
</body>
